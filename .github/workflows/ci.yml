name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_dev
          POSTGRES_DB: veritas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veritas -d veritas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://veritas:veritas_dev@localhost:5432/veritas
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm --filter @veritas/backend test:integration
        env:
          DATABASE_URL: postgresql://veritas:veritas_dev@localhost:5432/veritas
          REDIS_URL: redis://localhost:6379

      - name: Start backend for E2E
        run: pnpm --filter @veritas/backend start &
        env:
          NODE_ENV: test

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: E2E smoke
        run: pnpm --filter @veritas/e2e exec playwright install chromium && pnpm test:e2e
        env:
          E2E_API_BASE_URL: http://localhost:3000

      - name: Check formatting
        run: pnpm format:check
