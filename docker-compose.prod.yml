# Production stack — no host ports, no hardcoded secrets.
# Provide credentials via environment or a secrets manager before deploy.
#
# Example:
#   export POSTGRES_USER=veritas
#   export POSTGRES_PASSWORD=$(openssl rand -base64 32)
#   export POSTGRES_DB=veritas
#   export REDIS_PASSWORD=$(openssl rand -base64 32)
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritas
    restart: unless-stopped

  redis:
    image: redis:8.0-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritas
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veritas
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000/api/v1}
    depends_on:
      - backend
    networks:
      - veritas
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  veritas:
    driver: bridge
